# Akıl Çantası — Android APK derler ve GitHub "Releases" sayfasına koyar.
#
# Elle çalıştırmak için: Actions → "APK derle" → Run workflow.
# İmza: APK_KEYSTORE_B64 (anahtar dosyasının base64'ü) ve APK_KEYSTORE_PAROLA gizli değişkenleri
# varsa APK bu kalıcı anahtarla imzalanır; her yeni sürüm eskisinin üzerine kurulur.
# Yoksa geçici (hata ayıklama) anahtarı kullanılır: deneme için uygundur, ama sonraki sürümü
# kurmadan önce eskisini kaldırmak gerekir.
name: APK derle

on:
  workflow_dispatch:
    inputs:
      surum:
        description: 'Sürüm adı (ör. 0.9.0); boş = tarih'
        default: ''
        required: false
      yayinla:
        description: 'Sürüm sayfasında yayınla (hayir = yalnızca derle, APK çıktı olarak saklanır)'
        default: 'evet'
        required: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web uygulaması
        run: |
          npm ci --no-audit --no-fund --loglevel=error
          npm run build
          npx cap sync android

      # Fener yerel motoru: llama.cpp sabitlenmiş sürümü (android/app/src/main/cpp/CMakeLists.txt)
      - name: llama.cpp
        run: |
          git clone --depth 1 --branch b12032 https://github.com/ggml-org/llama.cpp android/app/src/main/cpp/llama.cpp
          git -C android/app/src/main/cpp/llama.cpp log -1 --format='llama.cpp %h %cd'
          # Makinede kurulu en yeni NDK (r28+: 16 KB sayfa hizalaması)
          if [ -n "$ANDROID_NDK_LATEST_HOME" ]; then echo "AKIL_NDK_VERSION=$(basename "$ANDROID_NDK_LATEST_HOME")" >> "$GITHUB_ENV"; fi

      # Adreno GPU için OpenCL başlıkları ve bağlama kütüphanesi (telefonda üreticininki kullanılır).
      # Başarısız olursa APK yalnızca işlemciyle çalışan motorla derlenir.
      - name: OpenCL (GPU)
        continue-on-error: true
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          O="$RUNNER_TEMP/opencl"; mkdir -p "$O/include" "$O/lib"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-Headers "$RUNNER_TEMP/ocl-h"
          cp -r "$RUNNER_TEMP/ocl-h/CL" "$O/include/"
          git clone --depth 1 https://github.com/KhronosGroup/OpenCL-ICD-Loader "$RUNNER_TEMP/ocl-l"
          cmake -S "$RUNNER_TEMP/ocl-l" -B "$RUNNER_TEMP/ocl-b" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=24 \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$O/include" -DBUILD_TESTING=OFF
          ninja -C "$RUNNER_TEMP/ocl-b" OpenCL
          cp "$RUNNER_TEMP/ocl-b/libOpenCL.so" "$O/lib/"
          echo "FENER_OPENCL_DIR=$O" >> "$GITHUB_ENV"
          echo "OpenCL hazır"

      - name: İmza anahtarı
        env:
          KS: ${{ secrets.APK_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/akil.jks"
            echo "AKIL_KEYSTORE=$RUNNER_TEMP/akil.jks" >> "$GITHUB_ENV"
            echo "Kalıcı anahtarla imzalanacak"
          else
            echo "::warning::APK_KEYSTORE_B64 yok: geçici anahtarla imzalanıyor (yalnız deneme)"
          fi

      - name: APK
        env:
          AKIL_KEYSTORE_PAROLA: ${{ secrets.APK_KEYSTORE_PAROLA }}
          AKIL_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -e
          ad="${{ github.event.inputs.surum }}"
          [ -n "$ad" ] || ad="${GITHUB_REF_NAME#v}"
          case "$ad" in main|"") ad="$(date -u +%Y.%m.%d)-$GITHUB_RUN_NUMBER";; esac
          echo "AKIL_SURUM=$ad" >> "$GITHUB_ENV"
          export AKIL_VERSION_NAME="$ad"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/akil-cantasi.apk"
          ls -la "$RUNNER_TEMP/akil-cantasi.apk"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$RUNNER_TEMP/akil-cantasi.apk" | head -3 || true
          echo "Yerel kütüphaneler:"; unzip -l "$RUNNER_TEMP/akil-cantasi.apk" | grep "lib/" || echo "(yok)"

      # Her yerel kütüphanenin bağımlılığı APK'da ya da Android'in herkese açık kütüphanelerinde olmalı;
      # 64 bit kütüphaneler 16 KB sayfa hizalı olmalı (Android 15+ cihazlar). Değilse derleme durur.
      - name: Yerel kütüphane denetimi
        run: |
          set -e
          D="$RUNNER_TEMP/apk-lib"; rm -rf "$D"; mkdir -p "$D"
          unzip -q -o "$RUNNER_TEMP/akil-cantasi.apk" 'lib/*' -d "$D" || { echo "yerel kütüphane yok"; exit 0; }
          RE="$(ls -d "${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"/toolchains/llvm/prebuilt/*/bin | head -1)/llvm-readelf"
          SYS="libc.so libm.so libdl.so liblog.so libandroid.so libOpenCL.so libvulkan.so libEGL.so libGLESv2.so libz.so"
          bad=0
          for abi in "$D"/lib/*; do
            for f in "$abi"/*.so; do
              for n in $("$RE" -d "$f" | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
                if [ ! -f "$abi/$n" ] && ! echo " $SYS " | grep -q " $n "; then echo "::error::$(basename "$abi")/$(basename "$f") → $n bulunamaz"; bad=1; fi
              done
              if [ "$(basename "$abi")" = "arm64-v8a" ]; then
                al=$("$RE" -lW "$f" | awk '$1=="LOAD"{print $NF; exit}')
                if [ "$al" != "0x4000" ] && [ "$al" != "0x10000" ]; then echo "::error::$(basename "$f") hizalaması $al (16 KB değil)"; bad=1; fi
              fi
            done
          done
          [ $bad = 0 ] && echo "Yerel kütüphaneler sağlam"
          exit $bad

      - name: Deneme derlemesi (yayınlanmaz)
        if: github.event.inputs.yayinla == 'hayir'
        uses: actions/upload-artifact@v4
        with:
          name: akil-cantasi-apk
          path: ${{ runner.temp }}/akil-cantasi.apk
          retention-days: 7

      - name: Sürüm sayfası
        if: github.event.inputs.yayinla != 'hayir'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="v$AKIL_SURUM"
          imza="kalıcı anahtar"
          [ -n "$AKIL_KEYSTORE" ] || imza="geçici deneme anahtarı (sonraki sürümden önce eskisini kaldırın)"
          notes="Android 7.0 ve üstü. Kurmak için APK'yı telefona indirip açın; \"bilinmeyen kaynaklardan yüklemeye\" izin verin.

          İmza: $imza

          Paketler (Vikipedi, harita, Fener modeli…) uygulamanın içinden indirilir."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/akil-cantasi.apk" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/akil-cantasi.apk" --title "Akıl Çantası $AKIL_SURUM" --notes "$notes" --prerelease
          fi
