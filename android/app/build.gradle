apply plugin: 'com.android.application'

// llama.cpp kaynakları APK derlemesinde indirilir (.github/workflows/apk.yml). Yoksa yerel motor
// derlenmez; uygulama yalnızca WebView'daki Fener motoruyla çalışır.
def fenerYerel = file("src/main/cpp/llama.cpp/CMakeLists.txt").exists()

android {
    namespace = "org.akilcantasi.app"
    // r28+: 16 KB bellek sayfalı (Android 15+) cihazlarla uyumlu hizalama; SME/KleidiAI için yeni clang.
    // GitHub derlemesinde makinede kurulu en yeni NDK kullanılır (apk.yml AKIL_NDK_VERSION'ı verir).
    def ndkSurum = System.getenv("AKIL_NDK_VERSION")
    if (fenerYerel && ndkSurum) ndkVersion = ndkSurum
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "org.akilcantasi.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // GitHub derlemesinde her sürüm bir öncekinin üzerine kurulabilsin diye artan numara
        versionCode((System.getenv("AKIL_VERSION_CODE") ?: "1") as int)
        versionName(System.getenv("AKIL_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Fener yerel motoru (llama.cpp): 64 bit ARM için tam, 32 bit ARM için yalnız işlemci.
        // Eski APK'larda yerel kütüphane yoktu; iki ABI de olunca her ARM cihaza kurulur.
        if (fenerYerel) {
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_BUILD_TYPE=Release", "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
                    def ocl = System.getenv("FENER_OPENCL_DIR")
                    if (ocl) arguments "-DFENER_OPENCL_DIR=" + ocl
                }
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Yayın imzası: anahtar dosyası ve parolası ortam değişkeninden gelir (GitHub Actions gizli değişkenleri).
    // Anahtar yoksa yayın derlemesi hata ayıklama anahtarıyla imzalanır (yalnız deneme içindir).
    signingConfigs {
        yayin {
            def ks = System.getenv("AKIL_KEYSTORE")
            if (ks && file(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("AKIL_KEYSTORE_PAROLA")
                keyAlias "akilcantasi"
                keyPassword System.getenv("AKIL_KEYSTORE_PAROLA")
            }
        }
    }
    buildTypes {
        release {
            def ks = System.getenv("AKIL_KEYSTORE")
            signingConfig = (ks && file(ks).exists()) ? signingConfigs.yayin : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    if (fenerYerel) {
        externalNativeBuild {
            cmake {
                path "src/main/cpp/CMakeLists.txt"
            }
        }
    }
    packaging {
        jniLibs {
            // GGML arka uçları (işlemci türevleri, GPU) çalışırken klasörden yüklenir: dosya olarak açılmalı
            useLegacyPackaging = true
            // OpenCL'e yalnız bağlanılır; telefonda üreticinin kütüphanesi kullanılır
            excludes += ['**/libOpenCL.so']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Şebekesiz mesh (AkilMeshPlugin): Nearby Connections. Sürüm: 19.5.1 (2026-09-28,
    // developers.google.com/android/guides/releases). Google Play Hizmetleri gerektirir.
    implementation "com.google.android.gms:play-services-nearby:19.5.1"
    // Son konum kaydı: telefon yeniden başlasa da süren zamanlanmış görevler
    implementation "androidx.work:work-runtime:2.10.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
