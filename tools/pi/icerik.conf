# Akıl Çantası — Pi'ye indirilecek içerik listesi (tools/pi/icerik-indir.sh okur)
# Başında # olan satırlar atlanır. Satırın sonundaki # sonrası açıklamadır.
#
# Biçim:
#   zim   <kiwix-klasörü>  <dosya-adı-başı>     en yeni sürüm Kiwix aynasından bulunur
#   dosya <alt-klasör>     <adres>               adres olduğu gibi indirilir (modeller vb.)
#   noktalar                                    afet noktaları OpenStreetMap'ten oluşturulur
#
# Kiwix klasörleri: https://download.kiwix.org/zim/
# Boyutlar yaklaşıktır (2026-11). Varsayılan liste ~10 GB tutar.

# --- Ansiklopedi ---
zim  wikipedia  wikipedia_tr_all_nopic          # ~3,7 GB  Türkçe Vikipedi, resimsiz
# zim wikipedia wikipedia_tr_all_maxi           # ~8,9 GB  resimli (nopic yerine)
zim  wiktionary wiktionary_tr_all_nopic         # ~810 MB  Vikisözlük
zim  wikibooks  wikibooks_tr_all_maxi           # ~27 MB   Vikikitap
zim  wikisource wikisource_tr_all_nopic         # ~46 MB   Vikikaynak

# --- Sağlık ---
